- id: agent-default-model
  config:
    provider: 'thoughtml-study-mock'
    model: 'deterministic-v1'
- id: session-title-llm
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: web-search-deepseek
  disabled: true
- insert:
    - id: study-mock-llm
      name: 'file:///C:/Users/Fatin/Downloads/tml2/study/dsh/plugins/mock-llm.js'
      config:
        condition: 'M'
    - id: study-mock-operation
      name: 'file:///C:/Users/Fatin/Downloads/tml2/study/dsh/plugins/mock-operation.js'
    - id: study-event-logger
      name: 'file:///C:/Users/Fatin/Downloads/tml2/study/dsh/plugins/event-logger.js'
      config:
        condition: 'M'
        outputDir: 'C:/Users/Fatin/Downloads/tml2/study/dsh/offline/runs/M/logs'
    - id: study-metrics
      name: 'file:///C:/Users/Fatin/Downloads/tml2/integrations/dsh/src/metrics.js'
      config:
        condition: 'M'
        format: 'markdown'
        outputDir: 'C:/Users/Fatin/Downloads/tml2/study/dsh/offline/runs/M/metrics'
    - id: study-reasoning-state
      name: 'file:///C:/Users/Fatin/Downloads/tml2/integrations/dsh/src/index.js'
      config:
        format: 'markdown'
        stateRoot: 'C:/Users/Fatin/Downloads/tml2/study/dsh/offline/runs/M/state'
        thoughtmlBinary: 'C:/Users/Fatin/Downloads/tml2/target/debug/thoughtml.exe'
        strict: true
        maxStateBytes: 65536
        maxContextChars: 12000
        historyLimit: 50
        recoveryGuidance: true
