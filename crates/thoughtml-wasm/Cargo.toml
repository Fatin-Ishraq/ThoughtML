[package]
name = "thoughtml-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for the ThoughtML parser."
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Depend on the library only (no clap / CLI), so it compiles cleanly to wasm.
thoughtml = { path = "../thoughtml", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
