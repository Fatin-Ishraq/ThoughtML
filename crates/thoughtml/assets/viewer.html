  </head>
  <body data-theme="dark" class="viewer">
    <!--
      The document model. `thml <doc>.thml --compute --html` bakes the canonical
      JSON into this tag, producing a self-contained, wasm-free interactive view.
      Left empty here; in dev the viewer falls back to /dev-model.json.
    -->
    <script type="application/json" id="thoughtml-model"></script>
    <!-- The document's display title (its file name). `thml … --html` fills this;
         left empty in dev, where the title falls back to the root scope's id. -->
    <script type="text/plain" id="thoughtml-title"></script>
    <!-- Filled only by `thoughtml stream`; a baked offline viewer leaves it
         empty and therefore never opens a network connection. -->
    <script type="application/json" id="thoughtml-stream-config"></script>

    <main class="split viewer-split">
      <section class="pane graph-pane">
        <div id="graph" class="graph-canvas"></div>

        <div class="doc-head">
          <div class="doc-brand">
            <span class="brand-mark">
              <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <g stroke="var(--text)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="15" y1="17" x2="49" y2="17" />
                  <line x1="32" y1="17" x2="32" y2="51" />
                </g>
                <circle cx="15" cy="17" r="7.5" fill="var(--text)" />
                <circle cx="49" cy="17" r="7.5" fill="var(--text)" />
                <circle cx="32" cy="51" r="7.5" fill="var(--accent)" />
              </svg>
            </span>
            <span class="brand-name">ThoughtML</span>
          </div>
          <div class="doc-title" id="doc-title">viewer</div>
          <div class="doc-sub" id="doc-sub">a reasoning timeline</div>
        </div>

        <button class="stream-status" id="stream-status" type="button" hidden aria-expanded="false" aria-controls="stream-panel">
          <span class="stream-dot"></span><span id="stream-status-text">Connecting</span>
        </button>

        <aside class="stream-panel" id="stream-panel" hidden>
          <div class="stream-panel-head">
            <div><strong>Live session</strong><span id="stream-updated"></span></div>
            <div class="stream-panel-actions">
              <button class="stream-download" id="stream-download" type="button" disabled title="Download the graph currently shown as standalone HTML"><span aria-hidden="true">↓</span> Snapshot</button>
              <button class="stream-panel-close" id="stream-panel-close" type="button" aria-label="Close live session panel">×</button>
            </div>
          </div>
          <div class="stream-section">
            <div class="stream-section-title">Watching</div>
            <div class="stream-files" id="stream-files"></div>
          </div>
          <div class="stream-section" id="stream-diagnostics-section" hidden>
            <div class="stream-section-title">Diagnostics</div>
            <div class="stream-diagnostics" id="stream-diagnostics"></div>
          </div>
          <div class="stream-section">
            <div class="stream-section-title">Activity</div>
            <div class="stream-activity" id="stream-activity"></div>
          </div>
        </aside>

        <div class="cluster dock">
          <button class="icon-btn" id="theme" title="Toggle light / dark"></button>
          <button class="icon-btn" id="fit" title="Fit to view"></button>
          <button class="icon-btn" id="legend-toggle" title="Toggle legend"></button>
          <span class="dock-sep"></span>
          <button class="icon-btn" id="zoom-in" title="Zoom in"></button>
          <button class="zoom-pct" id="zoom-pct" title="Reset zoom">100%</button>
          <button class="icon-btn" id="zoom-out" title="Zoom out"></button>
        </div>

        <div class="legend" id="legend" hidden></div>
        <div class="empty-state" id="empty-state" hidden>No model — bake one with <code>thoughtml &lt;doc&gt;.thml --html</code>.</div>
      </section>

    </main>

  </body>
</html>
