[package]
name = "thoughtml"
version.workspace = true
edition.workspace = true
description = "Reference parser for ThoughtML: surface AST -> canonical objects -> JSON, with diagnostics."
license.workspace = true
repository.workspace = true
# The workspace README is the canonical landing page; it's what ships on the npm
# package and in the release archives (dist bundles the package's readme).
readme = "../../README.md"

[[bin]]
name = "thoughtml"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "thoughtml"
path = "src/lib.rs"

[features]
default = ["cli"]
# The CLI (clap) is optional so the library can compile to wasm without it.
cli = ["dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
