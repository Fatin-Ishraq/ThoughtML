[package]
name = "thoughtml"
version.workspace = true
edition.workspace = true
description = "A plain-text language for reasoning you can check — reference parser and CLI toolchain (check, fmt, explain, diff, and the mirror). Run `thoughtml guide` for the whole language, embedded in the binary."
license.workspace = true
repository.workspace = true
homepage = "https://fatin-ishraq.github.io/ThoughtML/"
keywords = ["reasoning", "argumentation", "parser", "cli", "dsl"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]
# The workspace README is the canonical landing page; it's what ships on the npm
# package, the crates.io page, and in the release archives. cargo resolves this
# path and bundles it into the package as README.md at publish time.
readme = "../../README.md"

[[bin]]
name = "thoughtml"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "thoughtml"
path = "src/lib.rs"

[features]
default = ["cli"]
# The CLI (clap) is optional so the library can compile to wasm without it.
cli = ["dep:clap", "dep:ctrlc", "dep:getrandom"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3.5", optional = true }
getrandom = { version = "0.3", optional = true }
