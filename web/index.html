<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ThoughtML Playground — try the reasoning language live</title>
    <meta
      name="description"
      content="Try ThoughtML live in your browser — a plain-text language for reasoning you can check. Write claims, evidence, and confidence; watch the reasoning graph build and the mirror flag where your structure contradicts what you said. No install."
    />
    <meta name="keywords" content="ThoughtML playground, reasoning language, argument mapping, decision records, defeasible reasoning, AI reasoning, argumentation" />
    <meta name="author" content="Fatin Ishraq" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="canonical" href="https://fatin-ishraq.github.io/ThoughtML/playground/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ThoughtML" />
    <meta property="og:title" content="ThoughtML Playground — try the reasoning language live" />
    <meta property="og:description" content="Write ThoughtML on the left, watch the reasoning graph build on the right. The real parser, compiled to WebAssembly. No install." />
    <meta property="og:url" content="https://fatin-ishraq.github.io/ThoughtML/playground/" />
    <meta property="og:image" content="https://fatin-ishraq.github.io/ThoughtML/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="ThoughtML — a plain-text language for reasoning you can check. A mirror, not an oracle." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThoughtML Playground — try the reasoning language live" />
    <meta name="twitter:description" content="A mirror, not an oracle: watch it flag where your reasoning contradicts itself." />
    <meta name="twitter:image" content="https://fatin-ishraq.github.io/ThoughtML/social-card.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ThoughtML Playground",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (web browser)",
        "url": "https://fatin-ishraq.github.io/ThoughtML/playground/",
        "description": "Try ThoughtML live in your browser — the real parser compiled to WebAssembly.",
        "isPartOf": "https://fatin-ishraq.github.io/ThoughtML/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Fatin Ishraq" }
      }
    </script>
  </head>
  <body data-theme="dark">
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <span>Loading parser…</span>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <g stroke="var(--text)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="15" y1="17" x2="49" y2="17" />
              <line x1="32" y1="17" x2="32" y2="51" />
            </g>
            <circle cx="15" cy="17" r="7.5" fill="var(--text)" />
            <circle cx="49" cy="17" r="7.5" fill="var(--text)" />
            <circle cx="32" cy="51" r="7.5" fill="var(--accent)" />
          </svg>
        </span>
        <span class="brand-name">ThoughtML</span>
        <span class="brand-badge">playground</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme" title="Toggle light / dark"></button>
      </div>
    </header>

    <main class="split">
      <section class="pane editor-pane">
        <div class="pane-head"><span class="pane-title">Source</span></div>
        <div id="editor" class="editor"></div>
        <div class="examples-tray" id="examples-tray">
          <button class="tray-head" id="examples-toggle">
            <span class="chevron"></span><span>Examples</span>
          </button>
          <div class="pills" id="examples"></div>
        </div>
      </section>

      <div class="divider" id="divider" title="Drag to resize"></div>

      <section class="pane graph-pane">
        <div id="graph" class="graph-canvas"></div>

        <div class="cluster cluster-tl">
          <div class="segmented" id="view">
            <button data-view="readable" class="active">Viewer</button>
            <button data-view="structural">Structural</button>
          </div>
          <div class="segmented" id="lens" title="Colour the graph by a lens">
            <button data-lens="type" class="active">Type</button>
            <button data-lens="argument">Argument</button>
          </div>
          <div class="lens-key" id="lens-key" hidden></div>
        </div>

        <div class="cluster cluster-tr">
          <button class="icon-btn" id="fit" title="Fit to view"></button>
          <button class="icon-btn" id="relayout" title="Re-run layout"></button>
          <button class="icon-btn" id="legend-toggle" title="Toggle legend"></button>
          <button class="icon-btn" id="data-toggle" title="Canonical JSON / Surface AST"></button>
          <button class="icon-btn" id="download-html" title="Download standalone HTML"></button>
        </div>

        <div class="cluster cluster-br zoom-cluster">
          <button class="icon-btn" id="zoom-in" title="Zoom in"></button>
          <button class="zoom-pct" id="zoom-pct" title="Reset zoom">100%</button>
          <button class="icon-btn" id="zoom-out" title="Zoom out"></button>
        </div>

        <div class="cluster timeline" id="timeline" hidden title="Replay the argument as of a point in time">
          <span class="timeline-label">As&nbsp;of</span>
          <input type="range" id="time-slider" class="time-slider" min="0" max="1000" value="1000" step="1" />
          <span class="timeline-date" id="time-date">—</span>
        </div>

        <div class="legend" id="legend" hidden></div>
        <div class="empty-state" id="empty-state" hidden>Start typing ThoughtML to see the graph.</div>

        <aside class="drawer" id="drawer">
          <div class="drawer-head">
            <div class="segmented" id="data-tabs">
              <button data-data="json" class="active">Canonical</button>
              <button data-data="ast">Surface AST</button>
            </div>
            <div class="drawer-head-actions">
              <button class="icon-btn" id="copy-data" title="Copy"></button>
              <button class="icon-btn" id="drawer-close" title="Close"></button>
            </div>
          </div>
          <pre id="json" class="code data-pane active"></pre>
          <pre id="ast" class="code data-pane"></pre>
        </aside>

        <div class="diagnostics-bar" id="diag-bar">
          <div class="diag-head">
            <button class="diag-toggle" id="diag-toggle">
              <span class="diag-status ok" id="diag-status"><span class="dot"></span>No diagnostics</span>
              <span class="chevron"></span>
            </button>
            <button class="icon-btn diag-copy" id="diag-copy" title="Copy diagnostics" hidden></button>
          </div>
          <div class="diag-list" id="diagnostics"></div>
        </div>
      </section>

      <section class="pane detail-pane collapsed" id="detail">
        <div class="pane-head detail-head">
          <span class="detail-badge" id="detail-badge"></span>
          <span class="detail-id" id="detail-id"></span>
          <button class="icon-btn detail-close" id="detail-close" title="Close (Esc)"></button>
        </div>
        <div class="detail-body" id="detail-body"></div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
