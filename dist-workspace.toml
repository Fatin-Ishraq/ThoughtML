[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# No auto-publish: CI builds the binaries + npm package and attaches them to the
# GitHub Release; the npm package is then published by hand (`npm publish <tarball>`).

# SECURITY: never run the release workflow on pull requests. A PR run still ends
# with conclusion `success` (the build jobs just skip), which is enough to satisfy
# a `workflow_run` trigger — that is how a fork's PR could reach the PyPI publish
# job in `.github/workflows/pypi.yml`. `skip` omits the `pull_request` trigger from
# the generated workflow, so regenerating with `dist generate` preserves the fix.
pr-run-mode = "skip"
