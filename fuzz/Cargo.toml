[package]
name = "thoughtml-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace: the fuzz crate needs nightly and a sanitizer runtime, and
# must not be pulled into the root workspace's stable builds.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
thoughtml = { path = "../crates/thoughtml", default-features = false }
serde_json = "1"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compute"
path = "fuzz_targets/compute.rs"
test = false
doc = false
bench = false

# Fuzzing needs symbols and overflow checks; keep them on.
[profile.release]
debug = 1
overflow-checks = true
