version: 2

# Keep the three dependency surfaces patched. The CI `audit` job checks the
# committed Cargo.lock against the RustSec advisory database on every push;
# Dependabot is what actually opens the upgrade PRs.
#
# `github-actions` matters most here: the workflows pin third-party actions to
# commit SHAs (a tag can be repointed at new code by whoever owns the action), and
# a SHA pin only stays safe if something keeps bumping it. Dependabot rewrites the
# SHA and the trailing `# v4` comment together.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # NOTE: this also rewrites `.github/workflows/release.yml`, which is *generated*
  # by dist — Dependabot cannot tell a generated workflow from a hand-written one,
  # and there is no per-file ignore. dist then refuses to run because the file no
  # longer matches its output, which breaks the release at tag time. The
  # `generated-workflow` job in ci.yml catches that on the pull request instead;
  # when it fires, revert that one file (`git checkout <base> -- release.yml`) and
  # keep the rest of the bump.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
