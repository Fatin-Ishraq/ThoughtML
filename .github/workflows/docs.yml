name: Site

# Build the ThoughtML Book (mdBook) and the playground (Vite + wasm parser), and
# publish the combined site to GitHub Pages: the book at the root, the playground
# at /playground/. (Registered via a push whose diff includes this file.)
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - "crates/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (book + playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- The Book (mdBook) ---
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Build the book
        run: mdbook build docs

      # --- The playground (Vite + the wasm parser) ---
      # Same toolchain the CI `web` job uses, so the deploy build can't drift.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the playground
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build

      # --- Assemble: book at the root, playground under /playground/ ---
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/book/. _site/
          mkdir -p _site/playground
          cp -r web/dist/. _site/playground/
          # --- SEO: social card, robots.txt, a generated sitemap, and the
          #     Google Search Console site-verification file ---
          cp assets/social-card.png _site/social-card.png
          cp assets/social-card.svg _site/social-card.svg
          # The canonical language brief, served at the site root (/llms.txt) — the
          # same bytes the binary embeds via `thoughtml guide`.
          cp crates/thoughtml/llms.txt _site/llms.txt
          cp google0358dcbaac28de38.html _site/google0358dcbaac28de38.html
          printf 'User-agent: *\nAllow: /\nSitemap: https://fatin-ishraq.github.io/ThoughtML/sitemap.xml\n' > _site/robots.txt
          python3 scripts/gen-sitemap.py _site https://fatin-ishraq.github.io/ThoughtML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
