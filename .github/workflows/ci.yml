name: CI

on:
  push:
  pull_request:

# This workflow builds and tests pull-request code, including from forks, so it
# gets the narrowest token possible: read the checkout, nothing else. Without an
# explicit block the job would inherit the repository-wide default, which on
# older repositories is read/write.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, not a tag. Tags are
# mutable: whoever controls the action repository can repoint `@v4` at new code
# and it runs here on the next build.
jobs:
  parser:
    name: Reference parser (fmt + Clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        # Run from the workspace root; -p thoughtml selects the parser crate.
        run: cargo test -p thoughtml --all-features
        # The suite includes the conformance guard: every bundled example must
        # parse strict-clean (zero errors AND zero warnings) under default options.

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Checks Cargo.lock against the RustSec advisory database. Paired with
      # Dependabot (.github/dependabot.yml), which opens the upgrade PRs.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Playground (wasm + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The test runner uses Node's built-in TypeScript type stripping.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Dependency advisories (npm)
        working-directory: web
        # Advisory signal on the playground's dependency tree. Non-blocking: the
        # playground ships as static files with no server side, so a transitive
        # dev-only advisory should not wedge every unrelated PR.
        run: npm audit --audit-level=high || true
      - name: Viewer template freshness
        # Rebuilds the standalone viewer and fails if the committed template
        # (crates/thoughtml/assets/viewer.html, embedded via include_str!) is
        # stale. Node + deps are present here, so this guard runs for real.
        run: cargo test -p thoughtml --test viewer_freshness
      - name: Build wasm
        working-directory: web
        run: npm run wasm
      - name: Workspace tests
        working-directory: web
        run: npm test
      - name: Typecheck + build
        working-directory: web
        run: npm run build
