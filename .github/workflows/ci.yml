name: CI

on:
  push:
  pull_request:

# This workflow builds and tests pull-request code, including from forks, so it
# gets the narrowest token possible: read the checkout, nothing else. Without an
# explicit block the job would inherit the repository-wide default, which on
# older repositories is read/write.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, not a tag. Tags are
# mutable: whoever controls the action repository can repoint `@v4` at new code
# and it runs here on the next build.
jobs:
  parser:
    name: Reference parser (fmt + Clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        # Run from the workspace root; -p thoughtml selects the parser crate.
        run: cargo test -p thoughtml --all-features
        # The suite includes the conformance guard: every bundled example must
        # parse strict-clean (zero errors AND zero warnings) under default options.

  # The conformance test inside the suite hardcodes its file list, so an example
  # could be added and silently never checked. This walks the directory instead —
  # the guard cannot fall behind the corpus — and also pins the corpus as the
  # worked reference for canonical style.
  corpus:
    name: Examples are strict-clean and canonically formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build the CLI
        run: cargo build -p thoughtml --release
      - name: Check every example
        run: |
          status=0
          for f in $(find examples -name '*.thml' | sort); do
            # The bare invocation resolves imports as a project, so a library and
            # its importer are both checked the way a reader would run them.
            if ! ./target/release/thoughtml "$f" --strict >/dev/null; then
              echo "::error file=$f::not strict-clean under --strict"
              status=1
            fi
            if ! ./target/release/thoughtml fmt --check "$f"; then
              echo "::error file=$f::not canonical (run: thoughtml fmt -w $f)"
              status=1
            fi
          done
          exit $status

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks Cargo.lock against the RustSec advisory database. Paired with
      # Dependabot (.github/dependabot.yml), which opens the upgrade PRs.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # `.github/workflows/release.yml` is generated by dist, and dist refuses to run
  # if the committed copy has drifted from what it would produce. That check
  # currently happens at tag time, which is the worst moment to discover it — it
  # broke the v0.4.1 tag once, and a Dependabot action bump re-broke it right
  # after, because Dependabot cannot tell a generated workflow from a hand-written
  # one. Fail here instead, on the pull request that causes the drift.
  generated-workflow:
    name: Generated release workflow is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Check release.yml matches dist's output
        run: |
          set -euo pipefail
          if ! dist generate --check; then
            echo "::error::.github/workflows/release.yml has drifted from what dist generates."
            echo "It is a generated file: change dist-workspace.toml and run 'dist generate',"
            echo "rather than editing the workflow (or accepting a bot's edit to it)."
            exit 1
          fi

  web:
    name: Playground (wasm + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The test runner uses Node's built-in TypeScript type stripping.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Dependency advisories (npm)
        working-directory: web
        # Advisory signal on the playground's dependency tree. Non-blocking: the
        # playground ships as static files with no server side, so a transitive
        # dev-only advisory should not wedge every unrelated PR.
        run: npm audit --audit-level=high || true
      - name: Viewer template freshness
        # Rebuilds the standalone viewer and fails if the committed template
        # (crates/thoughtml/assets/viewer.html, embedded via include_str!) is
        # stale. Node + deps are present here, so this guard runs for real.
        run: cargo test -p thoughtml --test viewer_freshness
      - name: Build wasm
        working-directory: web
        run: npm run wasm
      - name: Workspace tests
        working-directory: web
        run: npm test
      - name: Typecheck + build
        working-directory: web
        run: npm run build
