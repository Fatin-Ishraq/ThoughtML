name: Fuzz

# `SECURITY.md` claims no byte sequence makes the parser panic, hang, or exhaust
# memory. The unit tests only cover the inputs someone thought of — the audit
# that prompted this found three stack overflows none of them reached — so the
# claim is checked here by actually trying to break it.
#
# Bounded per run so it gates a push without becoming the slowest job, and run
# weekly so it keeps searching between pushes rather than only on changes.
# Fuzzing needs nightly and a sanitizer runtime, hence ubuntu + nightly; it
# cannot run on the Windows MSVC target most development happens on.

on:
  push:
    branches: [main]
    paths:
      - "crates/thoughtml/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "crates/thoughtml/**"
      - "fuzz/**"
  schedule:
    # Mondays, 04:17 UTC — off the hour to avoid the scheduler's rush.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, compute]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly

      - name: Cache cargo-fuzz
        id: cache-fuzz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-bin-v1

      - name: Install cargo-fuzz
        if: steps.cache-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked

      # A scheduled run gets longer than a push: pushes should stay fast, the
      # weekly run is where the real searching happens.
      - name: Choose a duration
        id: budget
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SECONDS: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule)          seconds=900 ;;
            workflow_dispatch) seconds="${INPUT_SECONDS:-300}" ;;
            *)                 seconds=120 ;;
          esac
          if ! printf '%s' "$seconds" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::invalid duration"; exit 1
          fi
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_TO_RUN: ${{ steps.budget.outputs.seconds }}
        run: |
          set -euo pipefail
          cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time="$SECONDS_TO_RUN" \
            -rss_limit_mb=2048 \
            -timeout=25

      # A crash leaves a reproducer behind; keep it so the failure is actionable
      # rather than just a red X.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
