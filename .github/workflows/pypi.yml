name: Publish to PyPI

# Publish ThoughtML's platform wheels to PyPI via Trusted Publishing (OIDC) — no
# stored token. The wheels repackage the binaries cargo-dist already attached to
# the GitHub Release (see packaging/pypi/build_wheels.py), so this never compiles.
# Runs after cargo-dist successfully publishes the GitHub Release, or on demand
# for a given version. `workflow_run` is intentional: releases created with the
# built-in GITHUB_TOKEN do not emit another workflow-triggering release event.
#
# SECURITY — this job holds `id-token: write`, i.e. live PyPI publish rights.
# Three rules keep it that way; do not relax them without thinking it through:
#
#   1. It runs only for a tag push from this repository. `workflow_run` grants a
#      job this repo's privileges regardless of what triggered the upstream run,
#      so the trigger has to be pinned down rather than assumed.
#   2. It checks out a validated `refs/tags/vX.Y.Z` — never a ref derived from
#      the triggering run. What gets published must be what this repo tagged.
#   3. No `${{ }}` expression is interpolated into a `run:` script. Ref names may
#      contain shell metacharacters, so they arrive via `env:` and are validated.
#
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build & publish (e.g. 0.5.0)"
        required: true
        default: "0.5.0"

permissions:
  contents: read

jobs:
  # Resolve and validate the version *before* anything privileged happens, and
  # with no credentials of its own. A tag that is not plain SemVer fails closed.
  resolve:
    name: Resolve the release tag
    # Only a successful tag push from this very repository qualifies. A fork's
    # pull request produces `workflow_run.event == 'pull_request'` and a
    # `head_repository` that is not ours, so it can never reach the publish job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Resolve and validate version
        id: v
        env:
          # Untrusted-by-default inputs, kept out of the script body.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            # A completed tag workflow carries the tag in head_branch.
            version="${HEAD_BRANCH#v}"
          fi
          if ! printf '%s' "$version" \
               | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::refusing to publish: '$version' is not a plain SemVer version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  pypi:
    name: Build wheels and publish
    needs: resolve
    runs-on: ubuntu-latest
    # Must match the environment configured on the PyPI trusted-publisher.
    # Keep required reviewers on it: it is the last gate before a publish.
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      # The *validated* tag, not the triggering run's head SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # build_wheels.py verifies each downloaded archive's SHA-256 against the
      # release's dist-manifest.json before it repackages anything.
      - name: Build platform wheels from the release binaries
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python packaging/pypi/build_wheels.py --version "$VERSION"

      - name: Check the wheels
        run: |
          python -m pip install --upgrade twine
          python -m twine check packaging/pypi/build/dist/*

      # Trusted Publishing: no username/password, no token — GitHub's OIDC identity
      # is exchanged for a short-lived PyPI credential, scoped to this repo+workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packaging/pypi/build/dist
